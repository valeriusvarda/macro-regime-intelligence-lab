[project]
name = "macro-regime-intelligence-lab"
version = "0.1.0"
description = "A reproducible research laboratory for macroeconomic regime inference, validation, stress testing, and risk intelligence."
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = []

[build-system]
requires = ["uv_build>=0.11.29,<0.12"]
build-backend = "uv_build"

[dependency-groups]
dev = ["mypy>=2.3.0", "pytest>=9.1.1", "ruff>=0.16.0"]

[tool.mypy]
python_version = "3.14"
strict = true
show_error_codes = true
pretty = true
warn_unused_configs = true
